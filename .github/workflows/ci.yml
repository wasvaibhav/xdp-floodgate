# CI/CD:
#   every PR and push -> `test` (lint, build, unit, in-kernel verifier tests)
#   push to main      -> `release` waits for the owner's Approve/Reject
#                        (environment "production"), then publishes the image.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
          # asm/types.h lives in an arch dir that clang -target bpf doesn't search
          sudo ln -sf /usr/include/$(uname -m)-linux-gnu/asm /usr/include/asm

      - name: Generate (compile BPF with clang)
        run: go generate ./...

      - name: Lint
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      # Loads the real program into the runner's kernel: the verifier must
      # accept it, then BPF_PROG_RUN checks verdicts. Needs root.
      - name: Verifier + BPF_PROG_RUN tests
        run: |
          go test -c -o loader.test ./internal/loader
          sudo ./loader.test -test.v -test.count=1

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the job until approved.
    environment: production
    # A newer push replaces an older release still waiting for approval.
    concurrency:
      group: release
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The artifact is built from the same commit that is tagged into the
      # image below; both names carry the commit SHA.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
          sudo ln -sf /usr/include/$(uname -m)-linux-gnu/asm /usr/include/asm

      - name: Build release artifact
        run: |
          go generate ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o floodgate ./cmd/floodgate
          tar -czf "floodgate-${{ github.sha }}-linux-amd64.tar.gz" \
            floodgate deploy/floodgate.service deploy/floodgate.default README.md docs
          sha256sum "floodgate-${{ github.sha }}-linux-amd64.tar.gz" \
            > "floodgate-${{ github.sha }}-linux-amd64.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: floodgate-${{ github.sha }}-linux-amd64
          path: |
            floodgate-${{ github.sha }}-linux-amd64.tar.gz
            floodgate-${{ github.sha }}-linux-amd64.tar.gz.sha256

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
